[tox]
envlist = py{310,311,312},lint,type,coverage
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run pytest with coverage
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-xdist>=3.3.1
extras = dev
commands =
    pytest {posargs:tests/} --cov=. --cov-report=html --cov-report=term-missing

[testenv:lint]
description = Run linting checks (ruff, black, pylint)
skip_install = False
deps =
    ruff>=0.1.0
    black>=23.9.0
    pylint>=3.0.0
    isort>=5.12.0
commands =
    ruff check .
    black --check .
    pylint --exit-zero app.py training.py
    isort --check-only .

[testenv:format]
description = Format code with black and isort
skip_install = False
deps =
    black>=23.9.0
    isort>=5.12.0
    ruff>=0.1.0
commands =
    black .
    isort .
    ruff check . --fix

[testenv:type]
description = Run type checking with mypy
skip_install = False
deps =
    mypy>=1.5.0
commands =
    mypy . --ignore-missing-imports

[testenv:coverage]
description = Generate coverage report
skip_install = False
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
commands =
    pytest --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=60

[testenv:code-review]
description = Run comprehensive code review analysis
skip_install = False
deps =
    {[testenv:lint]deps}
    radon>=6.0.1
    mypy>=1.5.0
commands =
    radon metrics -s .
    radon complexity . -nb
    mypy . --ignore-missing-imports
    ruff check .

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = --strict-markers --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
